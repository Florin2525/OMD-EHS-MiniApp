<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OMD EHS - New Entry</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #777777);
      --section: var(--tg-theme-secondary-bg-color, #f1f1f1);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      font-size: 22px;
      margin: 4px 0 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 16px 0 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 0;
      outline: 0;
      border-radius: 10px;
      padding: 13px;
      background: var(--section);
      color: var(--text);
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      margin-top: 22px;
      padding: 14px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 700;
    }

    #status {
      text-align: center;
      color: var(--hint);
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📝 OMD EHS — New Entry</h1>

    <label for="site_id">Site ID</label>
    <input
      id="site_id"
      type="text"
      placeholder="Ex: CHI102"
      autocomplete="off"
    >

    <label for="description">Description</label>
    <textarea
      id="description"
      placeholder="Descrierea evenimentului"
    ></textarea>

    <button id="submit">SUBMIT</button>

    <div id="status"></div>

  </div>

<script>
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  document.getElementById('submit').addEventListener('click', () => {

    const site_id = document.getElementById('site_id').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!site_id || !description) {
      document.getElementById('status').textContent =
        'Completează toate cele 2 câmpuri.';
      return;
    }

    const data = {
      site_id: site_id,
      description: description
    };

    if (tg) {
      tg.sendData(JSON.stringify(data));
    } else {
      document.getElementById('status').textContent =
        'Formularul trebuie deschis din Telegram.';
      console.log(data);
    }
  });
</script>

</body>
</html>
