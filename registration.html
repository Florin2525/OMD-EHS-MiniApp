<div class="container">
  <h2>👤 Registration</h2>

  <button id="registerBtn" type="button">REGISTER</button>
</div>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  document.getElementById("registerBtn").addEventListener("click", () => {
    const data = {
      action: "registration"
    };

    tg.sendData(JSON.stringify(data));
  });
</script>
